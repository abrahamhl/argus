name: CI

on:
  push:
    branches:
      - master
      - main
      - 'agent/**'
      - 'feature/**'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Test & Offline Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint workspace
        run: pnpm lint

      - name: Build all packages and applications
        run: pnpm build

      - name: Run automated test suite (178 tests)
        run: pnpm test

      - name: Verify offline control plane demo (ARGUS_OFFLINE_MODE=true)
        run: pnpm demo
        env:
          ARGUS_OFFLINE_MODE: 'true'
